name: Engine (wasm) build
description: >
  Builds packages/engine-wasm/dist (Typst as wasm, its glue and the base fonts), which @typstream/engine
  depends on. dist/ is cached on the crate's inputs, so a warm run skips Rust entirely; build.sh then sees
  dist/ is up to date and turbo's build of the package does nothing. A cold run also restores target/.

outputs:
  cache-hit:
    description: "'true' when dist/ came from the cache: nothing was built and Rust wasn't set up."
    value: ${{ steps.dist.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - id: dist
      uses: actions/cache@v6
      with:
        path: packages/engine-wasm/dist
        # The inputs build.sh hashes into dist/.inputs: a key that missed one would restore a stale dist/,
        # which build.sh would then try to rebuild without Rust.
        key: engine-wasm-dist-${{ runner.os }}-${{ hashFiles('packages/engine-wasm/Cargo.lock', 'packages/engine-wasm/Cargo.toml', 'packages/engine-wasm/src/**', 'packages/engine-wasm/build.sh', 'packages/engine-wasm/scripts/fonts.mjs') }}

    # Typst 0.15.1 needs Rust ≥ 1.92 (CLAUDE.md).
    - if: steps.dist.outputs.cache-hit != 'true'
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - if: steps.dist.outputs.cache-hit != 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/engine-wasm -> target

    # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock exactly, so read it from there.
    - if: steps.dist.outputs.cache-hit != 'true'
      id: bindgen
      shell: bash
      run: |
        version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' packages/engine-wasm/Cargo.lock)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - if: steps.dist.outputs.cache-hit != 'true'
      uses: taiki-e/install-action@v2
      with:
        tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}

    # binaryen 133 is what Phase 0 measured with.
    - if: steps.dist.outputs.cache-hit != 'true'
      shell: bash
      env:
        BINARYEN: "133"
      run: |
        curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN/binaryen-version_$BINARYEN-x86_64-linux.tar.gz" \
          | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/binaryen-version_$BINARYEN/bin" >> "$GITHUB_PATH"

    - if: steps.dist.outputs.cache-hit != 'true'
      shell: bash
      run: packages/engine-wasm/build.sh
