# Nightly checks too slow for every PR (PLAN.md §11.8). To run them on a branch before merging:
#   gh workflow run nightly.yml --ref <branch> -f only=browser-suites
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run one group instead of all of them
        type: choice
        default: all
        options: [all, heal-properties, heal-mutation, browser-suites, docx-onlyoffice]

permissions:
  contents: read

env:
  NODE: "24"

jobs:
  heal-properties:
    name: Heal property campaign (20,000 runs)
    if: ${{ contains(fromJSON('["", "all", "heal-properties"]'), inputs.only || '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oracle
      # heal's dependents include @typstream/engine, which builds on engine-wasm.
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: pnpm build --filter=@typstream/heal...
      - run: pnpm --filter @typstream/heal test:long

  # DOCX exports in ONLYOFFICE (#131): a second layout engine, written apart from Word and LibreOffice. Report only:
  # it reads installed fonts, not the embedded ones, and the job summary has the numbers.
  docx-onlyoffice:
    name: DOCX (ONLYOFFICE)
    if: ${{ contains(fromJSON('["", "all", "docx-onlyoffice"]'), inputs.only || '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - name: Install poppler
        timeout-minutes: 6
        run: sudo apt-get install -y --no-install-recommends poppler-utils
      - run: docker pull onlyoffice/documentserver
      - run: pnpm turbo run build --filter=@typstream/docx-check^...
      - run: node tools/docx-check/check.mjs --onlyoffice
      # Other scripts (#134), for the numbers: ONLYOFFICE's PDF drops Indic vowel signs, Bengali equations' digits too.
      - run: node tools/docx-check/check.mjs --onlyoffice --scripts
        continue-on-error: true

  # Mutation testing of heal (PLAN.md §11.1, #6). The score goes to the job summary and the HTML
  # report is an artifact; `mutate` fails below the break threshold in stryker.config.mjs.
  heal-mutation:
    name: Heal mutation testing
    if: ${{ contains(fromJSON('["", "all", "heal-mutation"]'), inputs.only || '') }}
    runs-on: ubuntu-latest
    # A full run is ~2 h on 6 local cores; hosted runners have 4.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oracle
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      # No build: heal's tests run against the source of the packages they use.
      - run: pnpm --filter @typstream/heal mutate
      - name: Record the score
        if: ${{ !cancelled() }}
        working-directory: packages/heal
        run: node scripts/mutation-report.mjs --survivors | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: heal-mutation-report
          path: packages/heal/reports/mutation/
          retention-days: 30

  # Corpus-wide browser suites (tools/browser-suites, #19): final-render equivalence, flicker, accessibility and preview vs PDF over
  # mountTypstream on the real worker. One job per browser (Chromium also runs the adversarial set's equivalence).
  # Too slow for PRs (Chromium ~17 min, Firefox ~10, WebKit ~45); the timeout leaves room for a slow day.
  browser-suites:
    name: Browser suites (${{ matrix.browser }})
    if: ${{ contains(fromJSON('["", "all", "browser-suites"]'), inputs.only || '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      # In Playwright's image, like CI's browser jobs: no apt.
      - run: node tools/repo/playwright-docker.mjs pnpm --filter @typstream/browser-suites test:browser
        env:
          BROWSERS: ${{ matrix.browser }}
