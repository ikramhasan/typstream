# Nightly checks too slow for every PR (PLAN.md §11.8). To run them on a branch before merging:
#   gh workflow run nightly.yml --ref <branch> -f only=browser-suites
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run one group instead of all of them
        type: choice
        default: all
        options: [all, heal-properties, heal-mutation, browser-suites]

permissions:
  contents: read

env:
  NODE: node@24

jobs:
  heal-properties:
    name: Heal property campaign (20,000 runs)
    if: ${{ contains(fromJSON('["", "all", "heal-properties"]'), inputs.only || '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oracle
      # heal's dependents include @typstream/engine, which builds on engine-wasm.
      - uses: ./.github/actions/engine-wasm
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm build --filter=@typstream/heal...
      - run: pnpm --filter @typstream/heal test:long

  # Mutation testing of heal (PLAN.md §11.1, #6). The score goes to the job summary and the HTML
  # report is an artifact; `mutate` fails below the break threshold in stryker.config.mjs.
  heal-mutation:
    name: Heal mutation testing
    if: ${{ contains(fromJSON('["", "all", "heal-mutation"]'), inputs.only || '') }}
    runs-on: ubuntu-latest
    # A full run is ~2 h on 6 local cores; hosted runners have 4.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oracle
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      # No build: heal's tests run against the source of the packages they use.
      - run: pnpm --filter @typstream/heal mutate
      - name: Record the score
        if: ${{ !cancelled() }}
        working-directory: packages/heal
        run: node scripts/mutation-report.mjs --survivors | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: heal-mutation-report
          path: packages/heal/reports/mutation/
          retention-days: 30

  # Corpus-wide browser suites (tools/browser-suites, #19): final-render equivalence, flicker and accessibility over
  # mountTypstream on the real worker. One job per browser (Chromium also runs the adversarial set's equivalence).
  # Too slow for PRs (Chromium ~17 min, Firefox ~10, WebKit ~45); the timeout also leaves room for `--with-deps`,
  # whose apt mirror has taken 20 min on a bad day.
  browser-suites:
    name: Browser suites (${{ matrix.browser }})
    if: ${{ contains(fromJSON('["", "all", "browser-suites"]'), inputs.only || '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm --filter @typstream/browser-suites exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm --filter @typstream/browser-suites test:browser
        env:
          BROWSERS: ${{ matrix.browser }}
