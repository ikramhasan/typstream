# CI for PRs and main (PLAN.md §11.8). Each check is its own job so a PR shows lint, types, tests,
# size and perf separately. The long property campaign runs nightly (nightly.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job's pnpm/setup installs this Node and the pnpm pinned in package.json's packageManager,
# then runs `pnpm install --frozen-lockfile` against a cached store.
env:
  NODE: node@24
  # engine-wasm's own checks need Rust, binaryen and native typst; only the engine job has them. Jobs that reach
  # it through @typstream/engine restore its dist/ with ./.github/actions/engine-wasm instead.
  # The compile oracle (tools/compile-oracle) needs the built engine, and html-compat's tests compile with it
  # (a devDependency turbo would build), so both run in the engine job too. So do @typstream/node and its example
  # (its build copies Typst's fonts out of the Rust crate graph).
  NOT_ENGINE: >-
    --filter=!@typstream/engine-wasm --filter=!@typstream/compile-oracle --filter=!@typstream/html-compat
    --filter=!@typstream/node --filter=!@typstream/example-node-validate

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm check
      # TODO(#3): layering check (dependency-cruiser), API report diff (api-extractor), publint and attw.

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm check-types $NOT_ENGINE

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oracle
      - uses: ./.github/actions/engine-wasm
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm build $NOT_ENGINE
      - run: pnpm test $NOT_ENGINE

  # Every corpus document against native typst (corpus/README.md): page counts, warnings, expected errors,
  # and runaway documents hitting the time and memory limits (prlimit is in util-linux on the runner).
  # Heal's corpus tests run in the test job.
  corpus:
    name: Corpus (native typst)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TYPST_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v7
      - name: Install native typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm corpus:validate

  size:
    name: Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm size $NOT_ENGINE

  # Shared runners are too noisy for the strict latency budgets: report every number, fail only on a
  # large (> 3×) regression. Strict budgets are checked locally (`node scripts/perf.mjs`).
  perf:
    name: Perf (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm build $NOT_ENGINE
      - name: node packages/heal/scripts/perf.mjs
        env:
          PERF_TOLERANCE: 3
        run: |
          set -o pipefail
          {
            echo '### @typstream/heal perf'
            echo '```'
            node packages/heal/scripts/perf.mjs
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The Typst engine: Rust build (cached by rust-cache), tests against native typst, wasm size budget, API report and
  # package lint. Also html-compat, whose tests compile with the engine. Then the compile oracle (#13): do heal's outputs
  # compile with the engine? Then @typstream/node on top of it (corpus, watchdog, protocol conformance) and its example.
  engine:
    name: Engine (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Typst is pinned everywhere (CLAUDE.md); binaryen 133 is what Phase 0 measured with.
      TYPST: 0.15.1
      BINARYEN: "133"
    steps:
      - uses: actions/checkout@v7
      # Typst 0.15.1 needs Rust ≥ 1.92 (CLAUDE.md).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine-wasm -> target
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock exactly, so read it from there.
      - id: bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' packages/engine-wasm/Cargo.lock)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Install wasm-opt and native typst
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN/binaryen-version_$BINARYEN-x86_64-linux.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          ln -s "$RUNNER_TEMP/binaryen-version_$BINARYEN/bin/wasm-opt" "$bin/wasm-opt"
          curl -fsSL "https://github.com/typst/typst/releases/download/v$TYPST/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          ln -s "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" "$bin/typst"
          echo "$bin" >> "$GITHUB_PATH"
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm exec turbo run build check-types test size check:api check:package --filter=@typstream/engine-wasm --filter=@typstream/html-compat
      - run: pnpm exec turbo run check-types test --filter=@typstream/compile-oracle
      - run: pnpm exec turbo run build check-types test check:api check:package --filter=@typstream/node
      - name: examples/node-validate
        run: pnpm exec turbo run test --filter=@typstream/example-node-validate

  # The engine worker in real browsers (packages/engine/__tests__/browser): protocol conformance, streaming through
  # client + worker + engine-wasm, and the watchdog, in Chromium, Firefox and WebKit.
  browsers:
    name: Engine (browsers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: pnpm/setup@v3
        with: { runtime: "${{ env.NODE }}", cache: true, require-lockfile: true }
      - run: pnpm --filter @typstream/engine exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @typstream/engine test:browser

  # TODO(#19): Playwright suites (visual, flicker, a11y).
