# CI for PRs and main (PLAN.md §11.8). Each check is its own job so a PR shows lint, types, tests,
# size and perf separately, and slow ones are split across parallel jobs: a PR's CI should finish in
# about 5 minutes. Checks that can't run in that time go in nightly.yml: the long property campaign,
# mutation testing and the corpus-wide browser suites.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every job's ./.github/actions/pnpm sets up this Node (from the runners' tool cache, not a download) and the pnpm
# pinned in package.json's packageManager, then runs `pnpm install --frozen-lockfile` against a store cached once per
# lockfile (saved by lint, on main).
env:
  NODE: "24"
  # engine-wasm's own checks need native typst and cargo; only the engine jobs have them. Every job restores its
  # dist/ with ./.github/actions/engine-wasm (built with Rust and binaryen on a cache miss).
  # The compile oracle (tools/compile-oracle) needs the built engine, and html-compat's, edu's and mindmap's tests compile
  # with it (a devDependency turbo would build), so they run in the engine jobs too. So do @typstream/node and its example
  # (its build copies Typst's fonts out of the Rust crate graph).
  # examples/nextjs-ai-sdk's and examples/strict-csp's tests drive browsers, so they run in the browser jobs.
  NOT_ENGINE: >-
    --filter=!@typstream/engine-wasm --filter=!@typstream/compile-oracle --filter=!@typstream/html-compat --filter=!@typstream/edu
    --filter=!@typstream/mindmap
    --filter=!@typstream/node --filter=!@typstream/example-node-validate --filter=!@typstream/example-nextjs-ai-sdk
    --filter=!@typstream/example-strict-csp

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: write lets ./.github/actions/pnpm delete the store caches of earlier lockfiles.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      # The one job that saves the pnpm store, on pushes to main: PRs restore main's.
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}", save: "${{ github.event_name == 'push' }}" }
      - run: pnpm check
      - run: pnpm check:layers
      # Reads the API reports, which the test job's check:api keeps equal to the built packages.
      - run: pnpm check:api-docs
      # TODO(#3): publint and attw outside the engine jobs.

  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: pnpm check-types $NOT_ENGINE

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/oracle
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: pnpm build $NOT_ENGINE
      # The public API reports (api/*.api.md) match the built packages; the engine jobs check the rest.
      - run: pnpm check:api $NOT_ENGINE
      - run: pnpm test $NOT_ENGINE

  # Every corpus document against native typst (corpus/README.md): page counts, warnings, expected errors,
  # and runaway documents hitting the time and memory limits (prlimit is in util-linux on the runner).
  # Heal's corpus tests run in the test job.
  corpus:
    name: Corpus (native typst)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TYPST_VERSION: 0.15.1
    steps:
      - uses: actions/checkout@v7
      - name: Install native typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: pnpm corpus:validate

  # DOCX exports (#131): every Latin corpus document exported through @typstream/node, each file checked by
  # Microsoft's Open XML validator (any error fails) and laid out by LibreOffice, whose lines must match Typst's PDF
  # at least as often as the floors say: on the documents without equations or pictures, on those with equations
  # (#132), each of which must come out whole, and on those with pictures (#133), most of which must match the PDF's
  # pixels. LibreOffice reads Word's equations with its Math component. Then the plugins' conformance suites (#135):
  # edu's, mindmap's and Universe's examples, each valid and laid out as Typst's PDF, rules and borders included.
  docx:
    name: DOCX (validator, LibreOffice)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - name: Install LibreOffice and poppler
        timeout-minutes: 6
        run: sudo apt-get install -y --no-install-recommends libreoffice-writer-nogui libreoffice-math-nogui poppler-utils
      - run: pnpm turbo run build --filter=@typstream/docx-check^...
      - run: dotnet publish tools/docx-check/validator -c Release -o tools/docx-check/validator/out
      - run: >-
          node tools/docx-check/check.mjs --validate tools/docx-check/validator/out/validator.dll
          --min-lines 0.99 --min-math-lines 0.95 --min-picture-lines 0.92 --min-pictures 0.95
      # Arabic, Bengali, Devanagari and Chinese documents (#134).
      - run: >-
          node tools/docx-check/check.mjs --scripts --validate tools/docx-check/validator/out/validator.dll
          --min-lines 0.97 --min-math-lines 0.86 --min-picture-lines 0.94 --min-pictures 0.95
      - run: pnpm --filter @typstream/edu --filter @typstream/mindmap --filter @typstream/universe test:docx

  size:
    name: Size
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: pnpm size $NOT_ENGINE

  # Shared runners are too noisy for the strict latency budgets: report every number, fail only on a
  # large (> 3×) regression. Strict budgets are checked locally (`node scripts/perf.mjs`).
  perf:
    name: Perf (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: pnpm build $NOT_ENGINE
      - name: node packages/heal/scripts/perf.mjs
        env:
          PERF_TOLERANCE: 3
        run: |
          set -o pipefail
          {
            echo '### @typstream/heal perf'
            echo '```'
            node packages/heal/scripts/perf.mjs
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # The Typst engine, in two parallel shards on the cached dist/ (./.github/actions/engine-wasm builds it on a miss,
  # with Rust). One runs engine-wasm's tests against native typst, its wasm size budget, API report and package lint,
  # and html-compat's, edu's and mindmap's, whose tests compile with the engine (and native typst). The other runs the compile
  # oracle (#13: do heal's outputs compile with the engine?), then @typstream/node on top of it (corpus, watchdog,
  # protocol conformance) and its example. Their tests (and node's build) take Typst's fonts from the typst-assets crate, found with `cargo metadata`,
  # so each shard has cargo and the crate registry, though no target/.
  engine:
    name: Engine (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: wasm, html-compat, edu
            run: >-
              pnpm exec turbo run build check-types test size check:api check:package
              --filter=@typstream/engine-wasm --filter=@typstream/html-compat --filter=@typstream/edu
              --filter=@typstream/mindmap
          - shard: compile oracle, node
            run: >-
              pnpm exec turbo run check-types test --filter=@typstream/compile-oracle &&
              pnpm exec turbo run build check-types test check:api check:package --filter=@typstream/node &&
              pnpm exec turbo run test --filter=@typstream/example-node-validate
    env:
      # Typst is pinned everywhere (CLAUDE.md).
      TYPST: 0.15.1
    steps:
      - uses: actions/checkout@v7
      - id: wasm
        uses: ./.github/actions/engine-wasm
      # Set up already when the action built dist/. Typst 0.15.1 needs Rust ≥ 1.92 (CLAUDE.md).
      - if: steps.wasm.outputs.cache-hit == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.wasm.outputs.cache-hit == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/engine-wasm -> target
          shared-key: engine-registry
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install native typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v$TYPST/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: ${{ matrix.run }}

  # The engine worker in real browsers (packages/engine/__tests__/browser): protocol conformance, streaming through
  # client + worker + engine-wasm, and the watchdog. Then the renderers (packages/dom/__tests__/browser) and <Typstream>
  # (packages/react/__tests__/browser) against that worker, the mind map island (packages/mindmap/__tests__/browser),
  # and examples/strict-csp: both targets and the island under a strict Content-Security-Policy, with no violation. One job per browser; Chromium's also runs examples/nextjs-ai-sdk, a
  # production Next.js build streaming an answer into <Typstream>, and tools/browser-suites' preview vs PDF check (#118:
  # every edu page painted in the document panel equals the PDF export's; all three browsers run it nightly), and the
  # plugins' conformance suites' paged half (#135: edu's, mindmap's and Universe's examples, likewise).
  browsers:
    name: Engine (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      # Inside Playwright's image (tools/repo/playwright-docker.mjs; the first step pulls it): its browsers and their
      # libraries are installed there, so no `playwright install --with-deps`, whose apt mirror has stalled these jobs
      # for 10+ minutes.
      - run: node tools/repo/playwright-docker.mjs pnpm --filter @typstream/engine test:browser
      - run: node tools/repo/playwright-docker.mjs pnpm --filter @typstream/dom test:browser
      - run: node tools/repo/playwright-docker.mjs pnpm --filter @typstream/react test:browser
      - run: node tools/repo/playwright-docker.mjs pnpm --filter @typstream/mindmap test:browser
      - run: node tools/repo/playwright-docker.mjs pnpm exec turbo run test --filter=@typstream/example-strict-csp
      - if: matrix.browser == 'chromium'
        run: node tools/repo/playwright-docker.mjs pnpm exec turbo run test --filter=@typstream/example-nextjs-ai-sdk
      - if: matrix.browser == 'chromium'
        run: node tools/repo/playwright-docker.mjs pnpm --filter @typstream/browser-suites test:pdf
      - if: matrix.browser == 'chromium'
        run: >-
          node tools/repo/playwright-docker.mjs pnpm --filter @typstream/edu --filter @typstream/mindmap
          --filter @typstream/universe test:paged

  # Visual regression (tools/browser-suites): screenshots against committed baselines, taken inside Playwright's
  # Docker image as they are locally (scripts/visual.mjs), so the runner's fonts don't matter. On a mismatch the
  # actual screenshots and diffs are uploaded; `pnpm --filter @typstream/browser-suites visual:update` accepts them.
  visual:
    name: Visual (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/engine-wasm
      - uses: ./.github/actions/pnpm
        with: { node: "${{ env.NODE }}" }
      - run: pnpm --filter @typstream/browser-suites test:visual
        env:
          BROWSERS: ${{ matrix.browser }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-${{ matrix.browser }}
          path: tools/browser-suites/.vitest-attachments/
          if-no-files-found: ignore
