[package]
name = "typst-syntax-oracle"
version = "0.0.0"
edition = "2024"
publish = false
description = "Test oracle: Typst 0.15.1's real parser, exposed to Node for @typstream/heal property tests."

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
typst-syntax = "=0.15.1"
wasm-bindgen = "0.2"
serde_json = "1"
# typst-syntax's own dependencies, for its lexer (copied in by build.rs).
# Versions come from Cargo.lock, which typst-syntax pins.
ecow = "0.2"
typst-utils = "=0.15.1"
unicode-ident = "1"
unicode-math-class = "0.1"
unicode-script = "0.5"
unicode-segmentation = "1"
unscanny = "0.1"

[build-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
