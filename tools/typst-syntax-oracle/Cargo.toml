[package]
name = "typst-syntax-oracle"
version = "0.0.0"
edition = "2021"
publish = false
description = "Test oracle: Typst 0.15.1's real parser, exposed to Node for @typstream/heal property tests."

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
typst-syntax = "=0.15.1"
wasm-bindgen = "0.2"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
