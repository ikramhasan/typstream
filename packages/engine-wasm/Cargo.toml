[package]
name = "typstream-engine-wasm"
version = "0.0.0"
edition = "2021"
publish = false
description = "Typst 0.15.1 compiled to wasm for @typstream/engine-wasm: in-memory World, HTML, changed-page SVG and PDF."

[lib]
crate-type = ["cdylib", "rlib"]

# Standalone: not part of any parent Cargo workspace.
[workspace]

[features]
# PDF export: +0.34 MB brotli, in the default build so exports reuse the preview's
# warm compile (#18, PLAN §6.4). `--no-default-features` builds without it.
default = ["pdf"]
pdf = ["dep:typst-pdf"]

[dependencies]
# Typst is pinned everywhere (CLAUDE.md); upgrade the oracle and heal's recognizer port with it.
typst = "=0.15.1"
typst-html = "=0.15.1"
typst-layout = "=0.15.1"
typst-svg = "=0.15.1"
typst-pdf = { version = "=0.15.1", optional = true }
comemo = "0.5.1"
# Must match the wasm-bindgen CLI exactly (Cargo.lock pins 0.2.129).
wasm-bindgen = "0.2"
js-sys = "0.3"
# FontInfo as JSON for lazy fonts (fonts.rs); typst-library already depends on it.
serde_json = "1"
# Strong directions of characters, for text runs (text.rs); typst-layout already depends on it.
unicode-bidi = "0.3"
# Glyph outlines for canvas drawings (draw.rs); typst-library already depends on it.
ttf-parser = "0.25"
# Scripts of characters, for math fonts' fallback coverage (fonts.rs); typst-layout already depends on it.
unicode-script = "0.5"

[dev-dependencies]
# Native tools in examples/ compile on the calling thread: the font store is thread-local (fonts.rs), as wasm is
# single-threaded. typst already depends on it.
rayon = "1"

[profile.release]
# Phase 0: opt-level "z" is the smallest; "s"/"3" are 6%/14% bigger and 25%/35% faster
# (spikes/phase0/custom-engine/RESULTS.md).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
