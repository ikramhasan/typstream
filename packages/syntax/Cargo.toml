[package]
name = "typstream-syntax"
version = "0.0.0"
edition = "2024"
publish = false
description = "Typst 0.15.1's parser as wasm for @typstream/syntax: a document's lossless syntax tree as a flat array."

[lib]
crate-type = ["cdylib"]
path = "rust/lib.rs"

[workspace]

[dependencies]
typst-syntax = "=0.15.1"
# Must match the wasm-bindgen CLI exactly (Cargo.lock pins 0.2.129).
wasm-bindgen = "0.2"

[profile.release]
# As engine-wasm's: the smallest build.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
